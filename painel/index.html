<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: #f0f2f5; padding: 20px; color: #333;
    }
    .header {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; }
    .status { font-size: 13px; color: #666; }
    .dot {
      display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; background: #2ecc71; margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .cards-top { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
    .card-top {
      background: #fff; padding: 18px; border-radius: 12px;
      flex: 1; min-width: 150px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card-top .num { font-size: 30px; font-weight: bold; color: #667eea; }
    .card-top .lbl { font-size: 12px; color: #888; text-transform: uppercase; margin-top: 4px; }

    .controles { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    button {
      padding: 9px 16px; border: none; border-radius: 8px;
      font-size: 14px; cursor: pointer; font-weight: 600;
    }
    .btn-refresh { background: #667eea; color: #fff; }
    .btn-del-all { background: #e74c3c; color: #fff; }
    .btn-del { background: #e74c3c; color: #fff; padding: 6px 12px; font-size: 12px; }

    .busca {
      width: 100%; padding: 11px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; margin-bottom: 14px;
      background: #fff;
    }
    .busca:focus { outline: none; border-color: #667eea; }

    .lista { display: flex; flex-direction: column; gap: 14px; }

    .cadastro {
      background: #fff; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow: hidden;
      border-left: 4px solid #667eea;
    }
    .cadastro-header {
      display: flex; justify-content: space-between;
      align-items: center; gap: 10px;
      padding: 14px 18px;
      background: #f8f9ff;
      border-bottom: 1px solid #eef0f8;
      flex-wrap: wrap;
    }
    .cadastro-nome {
      font-size: 17px; font-weight: bold; color: #333;
    }
    .cadastro-data {
      font-size: 12px; color: #888;
    }

    .bloco-titulo {
      padding: 10px 18px;
      background: #eef2ff;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #4c5ce0;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #e0e5f8;
    }
    .bloco-util .bloco-titulo {
      background: #fff8e1;
      color: #b8860b;
      border-bottom: 1px solid #f5e7b8;
    }

    .cadastro-body {
      padding: 16px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .campo { font-size: 13px; }
    .campo .rotulo {
      color: #888; font-size: 11px;
      text-transform: uppercase; font-weight: 600;
      margin-bottom: 3px; letter-spacing: 0.3px;
    }
    .campo .valor { color: #333; word-break: break-word; }
    .campo.full { grid-column: 1 / -1; }

    .vazio { text-align: center; padding: 40px; color: #999; }
    .botoes-card {
      padding: 10px 18px;
      border-top: 1px solid #eef0f8;
      display: flex; justify-content: flex-end;
    }

    .aguardando {
      padding: 14px 18px;
      background: #fffbe6;
      color: #8a6d00;
      font-size: 13px;
      text-align: center;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🖥️ Painel de Controle</h1>
    <div class="status"><span class="dot"></span>Atualiza a cada 5 segundos</div>
  </div>

  <div class="cards-top">
    <div class="card-top">
      <div class="num" id="total">0</div>
      <div class="lbl">Total de cadastros</div>
    </div>
    <div class="card-top">
      <div class="num" id="hoje">0</div>
      <div class="lbl">Cadastros hoje</div>
    </div>
    <div class="card-top">
      <div class="num" id="idade-media">-</div>
      <div class="lbl">Idade média</div>
    </div>
  </div>

  <div class="controles">
    <button class="btn-refresh" onclick="carregar()">🔄 Atualizar agora</button>
    <button class="btn-del-all" onclick="apagarTudo()">🗑️ Apagar todos</button>
  </div>

  <input id="busca" class="busca" type="text" placeholder="🔍 Buscar por nome, WhatsApp, cidade..." oninput="filtrar()" />

  <div class="lista" id="lista"></div>

  <script>
    const API_URL = 'https://gets-invio-on-api.onrender.com';
    let todosDados = [];

    async function carregar() {
      try {
        const r = await fetch(API_URL + '/dados');
        const { dados } = await r.json();
        todosDados = dados;

        document.getElementById('total').textContent = dados.length;

        const hoje = new Date().toDateString();
        const doDia = dados.filter(d => new Date(d.recebidoEm).toDateString() === hoje);
        document.getElementById('hoje').textContent = doDia.length;

        if (dados.length > 0) {
          const media = dados.reduce((s, d) => s + Number(d.idade || 0), 0) / dados.length;
          document.getElementById('idade-media').textContent = media.toFixed(1);
        } else {
          document.getElementById('idade-media').textContent = '-';
        }

        renderizar(dados);
      } catch (e) {
        document.getElementById('lista').innerHTML =
          '<div class="vazio">❌ Não consegui carregar. O servidor tá rodando?</div>';
      }
    }

    function filtrar() {
      const termo = document.getElementById('busca').value.toLowerCase().trim();
      if (!termo) { renderizar(todosDados); return; }
      const filtrado = todosDados.filter(d =>
        (d.nome || '').toLowerCase().includes(termo) ||
        (d.whatsapp || '').toLowerCase().includes(termo) ||
        (d.moraOnde || '').toLowerCase().includes(termo) ||
        (d.endereco || '').toLowerCase().includes(termo) ||
        (d.profissao || '').toLowerCase().includes(termo)
      );
      renderizar(filtrado);
    }

    function esc(s) {
      return String(s == null ? '-' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function renderizar(dados) {
      if (dados.length === 0) {
        document.getElementById('lista').innerHTML =
          '<div class="vazio">📭 Nenhum cadastro ainda.</div>';
        return;
      }

      const html = dados.slice().reverse().map(d => {
        // Bloco do 2º formulário (Útil)
        let blocoUtil = '';
        if (d.util) {
          blocoUtil = `
            <div class="bloco-util">
              <div class="bloco-titulo">📝 Formulário Útil</div>
              <div class="cadastro-body">
                <div class="campo"><div class="rotulo">Sexo</div><div class="valor">${esc(d.util.sexo)}</div></div>
                <div class="campo"><div class="rotulo">É calmo(a)?</div><div class="valor">${esc(d.util.calmo)}</div></div>
                <div class="campo"><div class="rotulo">Apelido</div><div class="valor">${esc(d.util.apelido)}</div></div>
                <div class="campo"><div class="rotulo">Lazer</div><div class="valor">${esc(d.util.lazer)}</div></div>
                <div class="campo full"><div class="rotulo">O que te deixa triste</div><div class="valor">${esc(d.util.triste)}</div></div>
                <div class="campo full"><div class="rotulo">O que hoje não faria</div><div class="valor">${esc(d.util.naoFaria)}</div></div>
              </div>
            </div>
          `;
        } else {
          blocoUtil = `
            <div class="aguardando">⏳ Aguardando o cliente preencher o Formulário Útil...</div>
          `;
        }

        return `
        <div class="cadastro">
          <div class="cadastro-header">
            <div class="cadastro-nome">👤 ${esc(d.nome)}</div>
            <div class="cadastro-data">${new Date(d.recebidoEm).toLocaleString('pt-BR')}</div>
          </div>

          <div class="bloco-titulo">📋 Formulário Pessoal</div>
          <div class="cadastro-body">
            <div class="campo"><div class="rotulo">Idade</div><div class="valor">${esc(d.idade)}</div></div>
            <div class="campo"><div class="rotulo">Profissão</div><div class="valor">${esc(d.profissao)}</div></div>
            <div class="campo"><div class="rotulo">Signo</div><div class="valor">${esc(d.signo)}</div></div>
            <div class="campo"><div class="rotulo">Estado civil</div><div class="valor">${esc(d.estadoCivil)}</div></div>
            <div class="campo"><div class="rotulo">Filhos</div><div class="valor">${esc(d.temFilhos)}</div></div>
            <div class="campo"><div class="rotulo">Religião</div><div class="valor">${esc(d.religiao)}</div></div>
            <div class="campo"><div class="rotulo">Tem vínculo?</div><div class="valor">${esc(d.temVinculo)}</div></div>
            <div class="campo"><div class="rotulo">WhatsApp</div><div class="valor">${esc(d.whatsapp)}</div></div>
            <div class="campo"><div class="rotulo">Instagram</div><div class="valor">${esc(d.instagram)}</div></div>
            <div class="campo"><div class="rotulo">Endereço</div><div class="valor">${esc(d.endereco)}</div></div>
            <div class="campo"><div class="rotulo">Mora onde</div><div class="valor">${esc(d.moraOnde)}</div></div>
            <div class="campo full"><div class="rotulo">O que achou do site</div><div class="valor">${esc(d.achouSite)}</div></div>
          </div>

          ${blocoUtil}

          <div class="botoes-card">
            <button class="btn-del" onclick="apagar(${d.id})">🗑️ Excluir cadastro</button>
          </div>
        </div>
        `;
      }).join('');

      document.getElementById('lista').innerHTML = html;
    }

    async function apagar(id) {
      if (!confirm('Apagar esse cadastro?')) return;
      await fetch(API_URL + '/dados/' + id, { method: 'DELETE' });
      carregar();
    }

    async function apagarTudo() {
      if (!confirm('⚠️ Apagar TODOS os cadastros? Não tem volta!')) return;
      await fetch(API_URL + '/dados', { method: 'DELETE' });
      carregar();
    }

    carregar();
    setInterval(carregar, 5000);
  </script>
</body>
</html>
