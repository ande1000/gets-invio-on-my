<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Pessoal</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh; padding: 20px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .container {
      background: #fff; padding: 28px 24px; border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      width: 100%; max-width: 460px; margin: 20px 0;
    }
    h1 { font-size: 22px; color: #333; text-align: center; margin-bottom: 6px; }
    .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 22px; }
    .secao {
      font-size: 12px; color: #667eea; text-transform: uppercase;
      font-weight: bold; margin-top: 20px; margin-bottom: 4px;
      padding-bottom: 4px; border-bottom: 1px solid #eee;
    }
    label {
      display: block; font-size: 13px; color: #444;
      margin-bottom: 5px; margin-top: 14px; font-weight: 600;
    }
    input, select, textarea {
      width: 100%; padding: 11px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px; font-family: inherit; background: #fff;
    }
    textarea { min-height: 70px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%; padding: 13px; background: #667eea; color: #fff;
      border: none; border-radius: 8px; font-size: 16px;
      font-weight: bold; cursor: pointer; margin-top: 22px;
    }
    button:hover { background: #5568d3; }
    button:disabled { background: #aaa; }
    .erro {
      margin-top: 16px; padding: 12px; border-radius: 8px;
      font-size: 14px; display: none; text-align: center;
      background: #ffe6e6; color: #a12d2d; border: 1px solid #e6b3b3;
    }

    #telaSucesso {
      display: none; position: fixed; inset: 0;
      background: #FFD400; color: #000; z-index: 9999;
      justify-content: center; align-items: center;
      padding: 30px; text-align: center;
    }
    #telaSucesso .icone { font-size: 70px; margin-bottom: 20px; animation: pular 1s infinite; }
    #telaSucesso h2 { font-size: 34px; font-weight: 900; line-height: 1.2; margin-bottom: 15px; }
    #telaSucesso p { font-size: 18px; font-weight: 600; }

    @keyframes pular {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div id="telaSucesso">
    <div>
      <div class="icone">📨</div>
      <h2>AGORA AGUARDE<br>VAMOS ENTRAR EM CONTATO</h2>
      <p>Obrigado por preencher! 💛</p>
    </div>
  </div>

  <div class="container">
    <h1>📋 Formulário Pessoal</h1>
    <p class="sub">Preencha seus dados abaixo</p>

    <div class="secao">👤 Dados pessoais</div>

    <label for="nome">Nome completo *</label>
    <input id="nome" type="text" placeholder="Ex: João Silva" />

    <label for="idade">Idade *</label>
    <input id="idade" type="number" placeholder="Ex: 25" min="1" max="120" />

    <label for="profissao">Profissão *</label>
    <input id="profissao" type="text" placeholder="Ex: Professor" />

    <label for="signo">Signo *</label>
    <select id="signo">
      <option value="">Selecione...</option>
      <option>Áries</option><option>Touro</option><option>Gêmeos</option>
      <option>Câncer</option><option>Leão</option><option>Virgem</option>
      <option>Libra</option><option>Escorpião</option><option>Sagitário</option>
      <option>Capricórnio</option><option>Aquário</option><option>Peixes</option>
    </select>

    <label for="estadoCivil">Estado civil *</label>
    <select id="estadoCivil">
      <option value="">Selecione...</option>
      <option>Solteiro(a)</option><option>Namorando</option>
      <option>Casado(a)</option><option>Divorciado(a)</option>
      <option>Viúvo(a)</option><option>Prefiro não dizer</option>
    </select>

    <label for="temFilhos">Tem filhos? *</label>
    <select id="temFilhos">
      <option value="">Selecione...</option>
      <option>Não tenho</option><option>1 filho</option>
      <option>2 filhos</option><option>3 filhos</option><option>4 ou mais</option>
    </select>

    <label for="religiao">Qual sua religião? *</label>
    <select id="religiao">
      <option value="">Selecione...</option>
      <option>Católica</option><option>Evangélica</option>
      <option>Espírita</option><option>Umbanda/Candomblé</option>
      <option>Judaica</option><option>Islâmica</option>
      <option>Budista</option><option>Ateu</option>
      <option>Prefiro não dizer</option><option>Outra</option>
    </select>

    <label for="temVinculo">Tem vínculo com igreja/comunidade? *</label>
    <select id="temVinculo">
      <option value="">Selecione...</option>
      <option>Sim</option><option>Não</option>
    </select>

    <div class="secao">📍 Contato e localização</div>

    <label for="whatsapp">WhatsApp *</label>
    <input id="whatsapp" type="tel" placeholder="Ex: (11) 99999-9999" />

    <label for="instagram">Instagram</label>
    <input id="instagram" type="text" placeholder="Ex: @seu_usuario" />

    <label for="endereco">Endereço *</label>
    <input id="endereco" type="text" placeholder="Ex: Rua das Flores, 123" />

    <label for="moraOnde">Mora onde? *</label>
    <input id="moraOnde" type="text" placeholder="Ex: Centro - São Paulo/SP" />

    <div class="secao">💬 Opinião</div>

    <label for="achouSite">O que achou deste site? *</label>
    <textarea id="achouSite" placeholder="Escreva sua opinião..."></textarea>

    <button id="btn">Enviar</button>
    <div id="resultado" class="erro"></div>
  </div>

  <script>
    const API_URL = 'https://gets-invio-on-api.onrender.com';

    // Conta visita
    fetch(API_URL + '/visita', { method: 'POST' }).catch(() => {});

    const btn = document.getElementById('btn');
    const resultado = document.getElementById('resultado');
    const telaSucesso = document.getElementById('telaSucesso');

    function pegar(id) { return document.getElementById(id).value.trim(); }

    btn.addEventListener('click', async () => {
      const dadosForm = {
        nome: pegar('nome'), idade: pegar('idade'), profissao: pegar('profissao'),
        signo: pegar('signo'), estadoCivil: pegar('estadoCivil'),
        temFilhos: pegar('temFilhos'), religiao: pegar('religiao'),
        temVinculo: pegar('temVinculo'), whatsapp: pegar('whatsapp'),
        instagram: pegar('instagram'), endereco: pegar('endereco'),
        moraOnde: pegar('moraOnde'), achouSite: pegar('achouSite'),
      };

      resultado.style.display = 'none';

      const obrig = ['nome','idade','profissao','signo','estadoCivil','temFilhos','religiao','temVinculo','whatsapp','endereco','moraOnde','achouSite'];
      const faltando = obrig.filter(c => !dadosForm[c]);
      if (faltando.length > 0) {
        resultado.textContent = '⚠️ Preencha todos os campos com *';
        resultado.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const r = await fetch(API_URL + '/enviar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dadosForm)
        });
        const dados = await r.json();

        if (dados.sucesso) {
          telaSucesso.style.display = 'flex';
        } else {
          resultado.textContent = '❌ ' + (dados.erro || 'Erro.');
          resultado.style.display = 'block';
        }
      } catch (e) {
        resultado.textContent = '❌ Erro ao conectar. Tente novamente.';
        resultado.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Enviar';
    });
  </script>
</body>
</html>
